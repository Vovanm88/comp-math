github:
  token_env: GITHUB_TOKEN
  repo_full_name: Vovanm88/comp-math

polling:
  # If true, bot runs forever and sleeps between polls.
  loop_forever: true
  interval_seconds: 60

artifacts:
  # Name used by actions/upload-artifact
  artifact_name: solution-binary
  # Path inside the downloaded artifact zip (relative). If null, bot will try to auto-pick a single file.
  binary_path_in_artifact: null

runner:
  # Docker image that contains the sandbox runner.
  docker_image: comp-math-runner:latest
  # Limits enforced by docker (best-effort, not a full sandbox against kernel bugs).
  cpus: 1.0
  memory: 1g
  pids_limit: 256
  per_test_timeout_seconds: 2.0

tests:
  public_tests_dir: tests/open
  # Optional path on the bot machine (NOT in repo) with closed tests/generators/manifests.
  secret_tests_dir: null

state:
  work_dir: bot_state/work
  processed_commits_path: bot_state/processed_commits.json
  leaderboard_path: bot_state/leaderboard.json

leaderboard:
  # Smaller is better if we use total wall time.
  sort_order: asc
  top_n_in_comment: 10

